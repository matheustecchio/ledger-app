spring:
  application:
    name: Ledger
  datasource:
    url: ${LEDGER_DATABASE_URL:jdbc:postgresql://localhost:5432/ledger}
    username: ${LEDGER_DATABASE_USERNAME:ledger}
    password: ${LEDGER_DATABASE_PASSWORD:ledger_dev_only}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  graphql:
    graphiql:
      enabled: ${LEDGER_GRAPHIQL_ENABLED:true}

server:
  address: ${LEDGER_SERVER_ADDRESS:127.0.0.1}

ledger:
  cors:
    allowed-origin: ${LEDGER_FRONTEND_ORIGIN:http://localhost:5173}
  security:
    development-user-id: ${LEDGER_DEVELOPMENT_USER_ID:00000000-0000-0000-0000-000000000001}
