services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${LEDGER_DATABASE_NAME:-ledger}
      POSTGRES_USER: ${LEDGER_DATABASE_USERNAME:-ledger}
      POSTGRES_PASSWORD: ${LEDGER_DATABASE_PASSWORD:-ledger_dev_only}
    ports:
      - "127.0.0.1:${LEDGER_DATABASE_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - ledger-postgres-data:/var/lib/postgresql/data

volumes:
  ledger-postgres-data:
