server {
    listen 80;
    server_name _;

    location /graphql {
        proxy_pass http://backend:8080/graphql;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
